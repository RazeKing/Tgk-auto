name: Auto Post RSS to Telegram

on:
  schedule:
    # Каждые 4 часа (в 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 по UTC)
    - cron: "0 */4 * * *"
    # Пример: 3 раза в день в 06:00, 12:00 и 18:00 по UTC:
    # - cron: "0 6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RSS_URL: ${{ secrets.RSS_URL }}
        run: python bot.py

      - name: Commit updated posted_links.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_links.json
          if ! git diff --staged --quiet; then
            git commit -m "Update posted_links.json"
            git push
          else
            echo "No changes to posted_links.json"
          fi
